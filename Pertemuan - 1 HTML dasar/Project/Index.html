
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Profil Saya</title>
</head>
<body>

    <header>
        <h1>Profil Pribadi Saya</h1>
        <p>Selamat datang di halaman profil saya!</p>
    </header>

    <main class="container">

        <section class="profile">
            <img src="gambar/Gus.jpg" alt="Foto saya">
            <h2>Tentang Saya</h2>
            <p>Halo, saya sedang belajar web development.</p>
        </section>

        <section class="hobby">
            <h2>Hobi Saya</h2>
            <ul class="listHobi">
                <li>Membaca</li>
                <li>Programming</li>
            </ul>
        </section>

        <section class="contact">
            <h2>Kontak Saya</h2>

            <form>
                <label for="nama">Nama:</label>
                <input id="nama" name="nama" type="text"
                       placeholder="Masukkan nama Anda" required>

                <button type="submit">Kirim</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Profil Pribadi Saya</p>
    </footer>

</body>
</html>
